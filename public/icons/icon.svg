<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Household Hub app icon: a ticked line on a basil-green tile, with the
       iridescent sparkle that marks suggestions in the app. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa56d"/>
      <stop offset="1" stop-color="#16734a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset=".35" stop-color="#c39bff"/>
      <stop offset=".68" stop-color="#ff9cc4"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <!-- three list lines -->
  <rect x="196" y="150" width="200" height="30" rx="15" fill="#fff" opacity=".95"/>
  <rect x="196" y="241" width="200" height="30" rx="15" fill="#fff" opacity=".55"/>
  <rect x="196" y="332" width="130" height="30" rx="15" fill="#fff" opacity=".55"/>
  <!-- ticked circle -->
  <circle cx="140" cy="165" r="34" fill="#fff"/>
  <path d="M123 166l12 12 23-25" fill="none" stroke="#1e8a5a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- open circles -->
  <circle cx="140" cy="256" r="29" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="9"/>
  <!-- the sparkle: a suggested line -->
  <path fill="url(#glow)" d="M140 300c3 27 14 38 41 41-27 3-38 14-41 41-3-27-14-38-41-41 27-3 38-14 41-41z"/>
</svg>
